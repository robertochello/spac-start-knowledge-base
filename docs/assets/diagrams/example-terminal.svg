<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">Esempio morsetto</title>
  <desc id="desc">Schema generico con differenza tra dati filo e numero morsetto.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111827"/><stop offset="1" stop-color="#020617"/></linearGradient>
    <style>.title{fill:#f8fafc;font-family:Inter,Arial,sans-serif;font-size:26px;font-weight:800}.text{fill:#cbd5e1;font-family:Inter,Arial,sans-serif;font-size:15px}.label{fill:#f8fafc;font-family:Inter,Arial,sans-serif;font-size:18px;font-weight:700}.wire{stroke:#e5e7eb;stroke-width:5;stroke-linecap:round}.term{fill:#0e7490;stroke:#67e8f9;stroke-width:2}.box{fill:#172554;stroke:#60a5fa;stroke-width:1.5}</style>
  </defs>
  <rect width="1000" height="420" rx="26" fill="url(#bg)"/>
  <text x="48" y="58" class="title">Esempio generico — Rappresentazione morsetto</text>
  <text x="48" y="86" class="text">La scritta visibile deve derivare dal dato corretto, non da una correzione grafica manuale.</text>
  <line x1="140" y1="230" x2="860" y2="230" class="wire"/>
  <rect x="460" y="170" width="80" height="120" rx="16" class="term"/>
  <text x="480" y="236" class="label">X1</text>
  <rect x="164" y="140" width="200" height="56" rx="14" class="box"/>
  <text x="190" y="175" class="label">NumI / NumO</text>
  <text x="188" y="212" class="text">dati filo ingresso/uscita</text>
  <rect x="632" y="140" width="200" height="56" rx="14" class="box"/>
  <text x="688" y="175" class="label">NumM</text>
  <text x="668" y="212" class="text">numero morsetto</text>
</svg>
