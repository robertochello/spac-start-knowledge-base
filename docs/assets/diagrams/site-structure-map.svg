<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520" role="img" aria-labelledby="title desc">
  <title id="title">Mappa struttura sito</title>
  <desc id="desc">Schema delle cinque aree principali della knowledge base SPAC Start.</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.title{fill:#0f172a;font-family:Inter,Arial,sans-serif;font-size:26px;font-weight:800}.text{fill:#475569;font-family:Inter,Arial,sans-serif;font-size:14px}.label{fill:#0f172a;font-family:Inter,Arial,sans-serif;font-size:18px;font-weight:750}.core{fill:#e0f2fe;stroke:#0284c7;stroke-width:2}.box{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.6}.accent{fill:#ecfdf5;stroke:#0f766e;stroke-width:1.7}.line{stroke:#94a3b8;stroke-width:2}
    </style>
  </defs>
  <rect width="1180" height="520" rx="8" class="bg"/>
  <text x="52" y="58" class="title">SPAC Start Knowledge Base</text>
  <text x="52" y="86" class="text">La navigazione è organizzata per orientarsi, lavorare, seguire procedure, diagnosticare e mantenere gli standard.</text>

