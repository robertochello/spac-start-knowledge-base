<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520" role="img" aria-labelledby="title desc">
  <title id="title">DbCables replacement workflow</title>
  <desc id="desc">Controlled workflow for replacing DbCables database and aligning library version in SPAC.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#020617"/></linearGradient>
    <style>.title{fill:#f8fafc;font-family:Inter,Arial,sans-serif;font-size:26px;font-weight:800}.text{fill:#cbd5e1;font-family:Inter,Arial,sans-serif;font-size:14px}.label{fill:#f8fafc;font-family:Inter,Arial,sans-serif;font-size:17px;font-weight:760}.step{fill:#111827;stroke:#38bdf8;stroke-width:1.5}.gate{fill:#172554;stroke:#fbbf24;stroke-width:1.6}.ok{fill:#0e7490;stroke:#67e8f9;stroke-width:1.6}.arrow{stroke:#67e8f9;stroke-width:3;marker-end:url(#arrowhead)}</style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#67e8f9"/></marker>
  </defs>
  <rect width="1180" height="520" rx="28" fill="url(#bg)"/>
  <text x="54" y="58" class="title">Archivio Cavi — workflow DbCables</text>
  <text x="54" y="88" class="text">Sostituzione controllata del database, allineamento versione librerie e validazione funzionale in SPAC.</text>

  <rect x="58" y="160" width="170" height="96" rx="18" class="step"/>
  <text x="88" y="196" class="label">Backup</text>
  <text x="88" y="222" class="text">Salvare DbCables originale</text>

  <rect x="278" y="160" width="170" height="96" rx="18" class="step"/>
  <text x="308" y="196" class="label">Replace</text>
  <text x="308" y="222" class="text">Copia controllata del DB</text>

  <rect x="498" y="160" width="190" height="96" rx="18" class="gate"/>
  <text x="528" y="196" class="label">Allineamento</text>
  <text x="528" y="222" class="text">Versione librerie SPAC</text>

  <rect x="738" y="160" width="170" height="96" rx="18" class="step"/>
  <text x="768" y="196" class="label">Riavvio</text>
  <text x="768" y="222" class="text">Riaprire SPAC</text>

  <rect x="958" y="160" width="170" height="96" rx="18" class="ok"/>
  <text x="988" y="196" class="label">Validazione</text>
  <text x="988" y="222" class="text">Archivio consultabile</text>

  <line x1="228" y1="208" x2="278" y2="208" class="arrow"/>
  <line x1="448" y1="208" x2="498" y2="208" class="arrow"/>
  <line x1="688" y1="208" x2="738" y2="208" class="arrow"/>
  <line x1="908" y1="208" x2="958" y2="208" class="arrow"/>

  <rect x="150" y="340" width="880" height="84" rx="18" fill="#0f172a" stroke="#334155"/>
  <text x="190" y="374" class="label">Quality gate</text>
  <text x="190" y="400" class="text">Non usare DbCables custom in commessa reale senza backup, integrity check, test su progetto prova, allineamento librerie e rollback verificabile.</text>
</svg>