<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520" role="img" aria-labelledby="title desc">
  <title id="title">SPAC Start Knowledge Base map</title>
  <desc id="desc">Visual map showing the relationship between workflows, symbols, materials, troubleshooting and governance.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <style>
      .card { fill: #111827; stroke: #334155; stroke-width: 1.5; filter: url(#shadow); }
      .card-strong { fill: url(#accent); stroke: #7dd3fc; stroke-width: 1.5; filter: url(#shadow); }
      .title { fill: #f8fafc; font-family: Inter, Arial, sans-serif; font-size: 26px; font-weight: 800; }
      .label { fill: #f8fafc; font-family: Inter, Arial, sans-serif; font-size: 20px; font-weight: 750; }
      .text { fill: #cbd5e1; font-family: Inter, Arial, sans-serif; font-size: 15px; }
      .small { fill: #dbeafe; font-family: Inter, Arial, sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 1px; }
      .line { stroke: #38bdf8; stroke-width: 2.4; stroke-linecap: round; opacity: 0.75; }
    </style>
  </defs>
  <rect width="1180" height="520" rx="28" fill="url(#bg)"/>
  <text x="54" y="62" class="title">SPAC Start Knowledge Base</text>
  <text x="54" y="91" class="text">Manuale operativo strutturato per workflow, standard, materiali, simboli e troubleshooting.</text>

  <rect x="450" y="176" width="280" height="120" rx="22" class="card-strong"/>
  <text x="500" y="223" class="small">CORE</text>
  <text x="500" y="256" class="label">Procedure operative</text>
  <text x="500" y="281" class="text">Playbook, checklist e verifiche</text>

  <rect x="72" y="160" width="250" height="104" rx="20" class="card"/>
  <text x="110" y="203" class="label">Workflow</text>
  <text x="110" y="229" class="text">CAD, unifilare, multifilare</text>

  <rect x="72" y="308" width="250" height="104" rx="20" class="card"/>
  <text x="110" y="351" class="label">Simboli</text>
  <text x="110" y="377" class="text">Madre, Figlio, pin, libreria</text>

  <rect x="858" y="160" width="250" height="104" rx="20" class="card"/>
  <text x="896" y="203" class="label">Materiali</text>
  <text x="896" y="229" class="text">Archivi, import, validazione</text>

  <rect x="858" y="308" width="250" height="104" rx="20" class="card"/>
  <text x="896" y="351" class="label">Governance</text>
  <text x="896" y="377" class="text">Decision log, standard, qualità</text>

  <line x1="322" y1="212" x2="450" y2="226" class="line"/>
  <line x1="322" y1="360" x2="450" y2="266" class="line"/>
  <line x1="730" y1="226" x2="858" y2="212" class="line"/>
  <line x1="730" y1="266" x2="858" y2="360" class="line"/>

  <circle cx="590" cy="442" r="7" fill="#38bdf8"/>
  <text x="616" y="448" class="text">Ogni contenuto deve aiutare a decidere, risolvere, standardizzare o verificare.</text>
</svg>
