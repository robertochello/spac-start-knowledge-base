<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="560" viewBox="0 0 1180 560" role="img" aria-labelledby="title desc">
  <title id="title">Percorsi di lettura</title>
  <desc id="desc">Schema dei percorsi consigliati per usare la knowledge base.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#020617"/></linearGradient>
    <style>.title{fill:#f8fafc;font-family:Inter,Arial,sans-serif;font-size:28px;font-weight:800}.text{fill:#cbd5e1;font-family:Inter,Arial,sans-serif;font-size:14px}.label{fill:#f8fafc;font-family:Inter,Arial,sans-serif;font-size:18px;font-weight:750}.start{fill:#0e7490;stroke:#67e8f9;stroke-width:2}.box{fill:#111827;stroke:#334155;stroke-width:1.6}.accent{fill:#172554;stroke:#60a5fa;stroke-width:1.7}.arrow{stroke:#67e8f9;stroke-width:2.5;marker-end:url(#arrowhead)}</style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#67e8f9"/></marker>
  </defs>
  <rect width="1180" height="560" rx="28" fill="url(#bg)"/>
  <text x="54" y="58" class="title">Percorsi rapidi di lettura</text>
  <text x="54" y="88" class="text">Scegli il percorso in base al problema: non serve leggere tutta la guida in ordine.</text>
  <rect x="70" y="230" width="210" height="100" rx="22" class="start"/>
  <text x="122" y="270" class="label">Ho un problema</text>
  <text x="110" y="298" class="text">da risolvere in SPAC</text>
  <rect x="370" y="90" width="230" height="90" rx="20" class="box"/>
  <text x="420" y="128" class="label">Capire</text>
  <text x="405" y="154" class="text">Overview · concetti · FAQ</text>
  <rect x="370" y="225" width="230" height="90" rx="20" class="box"/>
  <text x="420" y="263" class="label">Operare</text>
  <text x="404" y="289" class="text">Workflow · playbook</text>
  <rect x="370" y="360" width="230" height="90" rx="20" class="box"/>
  <text x="416" y="398" class="label">Verificare</text>
  <text x="405" y="424" class="text">Checklist · quality gates</text>
  <rect x="720" y="90" width="240" height="90" rx="20" class="accent"/>
  <text x="770" y="128" class="label">Simboli</text>
  <text x="750" y="154" class="text">attributi · pinatura · nomi</text>
  <rect x="720" y="225" width="240" height="90" rx="20" class="accent"/>
  <text x="770" y="263" class="label">Archivi</text>
  <text x="748" y="289" class="text">materiali · cavi DbCables</text>
  <rect x="720" y="360" width="240" height="90" rx="20" class="accent"/>
  <text x="762" y="398" class="label">Diagnostica</text>
  <text x="752" y="424" class="text">known issues · casi pratici</text>
  <line x1="280" y1="280" x2="370" y2="135" class="arrow"/>
  <line x1="280" y1="280" x2="370" y2="270" class="arrow"/>
  <line x1="280" y1="280" x2="370" y2="405" class="arrow"/>
  <line x1="600" y1="135" x2="720" y2="135" class="arrow"/>
  <line x1="600" y1="270" x2="720" y2="270" class="arrow"/>
  <line x1="600" y1="405" x2="720" y2="405" class="arrow"/>
</svg>