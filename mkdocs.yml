site_name: SPAC Start Knowledge Base
site_description: Knowledge base operativa per workflow SPAC Start, simboli custom, attributi, pinatura e troubleshooting.
site_author: Roberto Chello
site_url: https://robertochello.github.io/spac-start-knowledge-base/

repo_name: robertochello/spac-start-knowledge-base
repo_url: https://github.com/robertochello/spac-start-knowledge-base
edit_uri: edit/master/docs/

theme:
  name: material
  language: it
  palette:
    - scheme: slate
      primary: blue
      accent: cyan
    - scheme: default
      primary: blue
      accent: cyan
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Start:
      - Home: index.md
      - Concetti SPAC: concepts.md
      - Overview: 00-overview.md
      - Libreria custom: 15-custom-library.md
      - Template progetto: 16-project-template.md
      - Command Reference: command-reference.md
      - FAQ: faq.md
      - Roadmap: roadmap.md
      - Changelog: changelog.md
  - Workflow:
      - Interfaccia e menu: 01-interface-and-menu.md
      - Workflow CAD 2D: 02-cad-workflow.md
      - Pagine, cartigli e immagini: 05-pages-titleblocks-images.md
      - Numerazione e identificazione fili: 18-wire-numbering.md
  - Unifilare:
      - Schema unifilare: 17-unifilare.md
      - Numerazione e identificazione fili: 18-wire-numbering.md
  - Simboli:
      - Simboli custom: 03-custom-symbols.md
      - Attributi e pinatura: 04-attributes-and-pinning.md
      - Checklist validazione simbolo: 10-symbol-validation-checklist.md
      - Nomenclatura simboli: 19-symbol-naming.md
      - Dizionario abbreviazioni: 20-abbreviations.md
      - Standard simboli: standards/symbols.md
  - Cavi:
      - Archivio Cavi DbCables: 25-cable-archive-dbcables.md
      - Aggiornare DbCables: playbooks/update-dbcables-archive.md
      - Versione non congruente: known-issues/dbcables-version-mismatch.md
  - Multifilare:
      - Multifilare: 09-multifilare.md
      - Rimandi e morsetti: 06-cross-references-terminals.md
  - Troubleshooting:
      - Troubleshooting generale: 07-troubleshooting.md
      - Known Issues: known-issues/index.md
      - Pin non agganciato: known-issues/pin-not-snapping.md
      - Riferimento immagine mancante: known-issues/missing-image-reference.md
      - Cross-reference obsoleto: known-issues/obsolete-cross-reference.md
      - DbCables versione non congruente: known-issues/dbcables-version-mismatch.md
      - Casi pratici: 12-practical-cases.md
  - Standards:
      - Introduzione: standards/index.md
      - Standard operativi: 08-standards.md
      - Standard simboli: standards/symbols.md
      - Standard CAD: standards/cad.md
  - Governance:
      - Decision log: 11-decision-log.md
      - Linee guida manutenzione: 13-maintenance-guidelines.md
      - Quality gates: 14-quality-gates.md
      - Deploy manuale senza Actions: 26-deploy-without-actions.md
      - Glossario: glossary.md
  - Playbook:
      - Introduzione: playbooks/index.md
      - Creare un simbolo custom: playbooks/create-custom-symbol.md
      - Validare un simbolo: playbooks/validate-custom-symbol.md
      - Diagnosticare pin non agganciato: playbooks/diagnose-pin-not-snapping.md
      - Gestire cartiglio e logo: playbooks/titleblock-logo-workflow.md
      - Gestire accessori e bobine: playbooks/manage-accessories-and-coils.md
      - Verificare rappresentazione morsetti: playbooks/terminal-representation.md
      - Diagnosticare rimandi alimentazione: playbooks/power-reference-diagnostic.md
      - Associare materiali: playbooks/material-association.md
