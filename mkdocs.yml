site_name: SPAC Start 26 · Guida pratica
site_description: Guida semplice e operativa per SPAC Start 26: comandi, schemi, simboli, materiali, cavi e problemi comuni.
site_url: https://robertochello.github.io/spac-start-knowledge-base/

repo_name: robertochello/spac-start-knowledge-base
repo_url: https://github.com/robertochello/spac-start-knowledge-base
edit_uri: edit/master/docs/

theme:
  name: material
  language: it
  palette:
    - scheme: slate
      primary: blue
      accent: cyan
    - scheme: default
      primary: blue
      accent: cyan
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.path
    - navigation.footer
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tooltips

extra:
  generator: false

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js
  - assets/javascripts/mermaid-init.js

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: index.md

  - Guida semplice:
      - Da dove partire: 00-how-to-use.md
      - Comandi e click esatti: command-reference.md

  - Download: downloads.md

  - Cosa devi fare:
      - Nuovo progetto: 16-project-template.md
      - Schema unifilare: 17-unifilare.md
      - Schema multifilare: 09-multifilare.md
      - Numerazione fili: 18-wire-numbering.md
      - Morsetti e rimandi: 06-cross-references-terminals.md
      - Creare un simbolo: playbooks/create-custom-symbol.md
      - Attributi e pin: 04-attributes-and-pinning.md
      - Associare materiali: playbooks/material-association.md
      - Archivio materiali: 21-material-archives.md
      - Archivio cavi: 25-cable-archive-dbcables.md
      - Altre operazioni:
          - Libreria custom: 15-custom-library.md
          - Interfaccia e menu: 01-interface-and-menu.md
          - Pagine e immagini: 05-pages-titleblocks-images.md
          - Workflow CAD 2D: 02-cad-workflow.md
          - Simboli custom: 03-custom-symbols.md

  - Problemi:
      - Problemi e soluzioni: 07-troubleshooting.md
      - Pin non agganciato: playbooks/diagnose-pin-not-snapping.md
      - Layer / oggetti residui: playbooks/clean-residual-objects.md
      - Rimandi alimentazione: playbooks/power-reference-diagnostic.md
      - Numero morsetto sbagliato: playbooks/terminal-representation.md
      - Immagine mancante: known-issues/missing-image-reference.md
      - DbCables non allineato: known-issues/dbcables-version-mismatch.md

  - Riferimenti:
      - FAQ: faq.md
      - Glossario: glossary.md
      - Concetti base: concepts.md
      - Manuale consolidato: guida-operativa-completa.md
      - Nomenclatura simboli: 19-symbol-naming.md
      - Abbreviazioni: 20-abbreviations.md
      - Standard:
          - Standard operativi: 08-standards.md
          - Standard CAD: standards/cad.md
          - Standard simboli: standards/symbols.md
          - Standard materiali: standards/materials.md
      - Manutenzione:
          - Casi pratici: 12-practical-cases.md
          - Decisioni: 11-decision-log.md
          - Linee guida: 13-maintenance-guidelines.md
          - Controlli qualità: 14-quality-gates.md
          - Back-check: 26-back-check-controls.md
          - Immagini e grafica: 22-visual-assets-guidelines.md
          - Roadmap: roadmap.md
