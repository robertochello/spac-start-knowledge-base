site_name: SPAC Start Knowledge Base
site_description: Guida operativa per SPAC Start 26: comandi esatti, setup, schemi, simboli, archivi e troubleshooting.
site_author: Roberto Chello
site_url: https://robertochello.github.io/spac-start-knowledge-base/

repo_name: robertochello/spac-start-knowledge-base
repo_url: https://github.com/robertochello/spac-start-knowledge-base
edit_uri: edit/master/docs/

theme:
  name: material
  language: it
  palette:
    - scheme: slate
      primary: blue
      accent: cyan
    - scheme: default
      primary: blue
      accent: cyan
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.footer
    - navigation.tracking
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js
  - assets/javascripts/mermaid-init.js

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: index.md

  - Guida pratica:
      - Comandi e click esatti: command-reference.md
      - Scegli cosa devi fare: 00-how-to-use.md
      - Concetti base SPAC: concepts.md
      - FAQ: faq.md
      - Glossario: glossary.md
      - Panoramica knowledge base: 00-overview.md
      - Manuale completo (riferimento): guida-operativa-completa.md

  - Lavoro in SPAC:
      - Setup progetto:
          - Template progetto: 16-project-template.md
          - Libreria custom: 15-custom-library.md
          - Interfaccia e menu: 01-interface-and-menu.md
          - Pagine, cartigli e immagini: 05-pages-titleblocks-images.md
          - Workflow CAD 2D: 02-cad-workflow.md
      - Schemi:
          - Schema unifilare: 17-unifilare.md
          - Schema multifilare: 09-multifilare.md
          - Numerazione e identificazione fili: 18-wire-numbering.md
          - Rimandi, cross-reference e morsetti: 06-cross-references-terminals.md
      - Simboli:
          - Simboli custom: 03-custom-symbols.md
          - Attributi e pinatura: 04-attributes-and-pinning.md
          - Nomenclatura simboli: 19-symbol-naming.md
          - Dizionario abbreviazioni: 20-abbreviations.md
      - Materiali e cavi:
          - Archivi materiali custom: 21-material-archives.md
          - Archivio Cavi DbCables: 25-cable-archive-dbcables.md
          - Back-check e controlli incrociati: 26-back-check-controls.md
          - Download: downloads.md

  - Procedure:
      - Come usare i playbook: playbooks/index.md
      - Simboli:
          - Creare un simbolo custom: playbooks/create-custom-symbol.md
          - Validare un simbolo: playbooks/validate-custom-symbol.md
          - Diagnosticare pin non agganciato: playbooks/diagnose-pin-not-snapping.md
          - Pulire oggetti residui: playbooks/clean-residual-objects.md
      - Schemi:
          - Gestire accessori e bobine: playbooks/manage-accessories-and-coils.md
          - Verificare rappresentazione morsetti: playbooks/terminal-representation.md
          - Diagnosticare rimandi alimentazione: playbooks/power-reference-diagnostic.md
      - Cartigli e immagini:
          - Gestire cartiglio e logo: playbooks/titleblock-logo-workflow.md
      - Archivi:
          - Associare materiali: playbooks/material-association.md
          - Aggiornare Archivio Cavi DbCables: playbooks/update-dbcables-archive.md
      - Checklist ed esempi:
          - Checklist validazione simbolo: 10-symbol-validation-checklist.md
          - Esempi operativi: 24-operational-examples.md

  - Problemi e diagnosi:
      - Diagnosi rapida: 07-troubleshooting.md
      - Problemi noti:
          - Indice: known-issues/index.md
          - Pin non agganciato: known-issues/pin-not-snapping.md
          - Riferimento immagine mancante: known-issues/missing-image-reference.md
          - Cross-reference obsoleto: known-issues/obsolete-cross-reference.md
          - DbCables versione non congruente: known-issues/dbcables-version-mismatch.md
      - Casi pratici: 12-practical-cases.md

  - Riferimenti:
      - Standard:
          - Standard operativi: 08-standards.md
          - Indice standard: standards/index.md
          - Standard CAD: standards/cad.md
          - Standard simboli: standards/symbols.md
          - Standard materiali: standards/materials.md
      - Manutenzione knowledge base:
          - Decisioni operative: 11-decision-log.md
          - Linee guida manutenzione: 13-maintenance-guidelines.md
          - Quality gate e validazione: 14-quality-gates.md
          - Linee guida immagini: 22-visual-assets-guidelines.md
      - Roadmap: roadmap.md
