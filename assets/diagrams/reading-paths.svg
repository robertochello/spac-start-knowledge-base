<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="500" viewBox="0 0 1180 500" role="img" aria-labelledby="title desc">
  <title id="title">Percorsi di lettura</title>
  <desc id="desc">Schema dei percorsi consigliati per usare la knowledge base.</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.title{fill:#0f172a;font-family:Inter,Arial,sans-serif;font-size:26px;font-weight:800}.text{fill:#475569;font-family:Inter,Arial,sans-serif;font-size:14px}.label{fill:#0f172a;font-family:Inter,Arial,sans-serif;font-size:18px;font-weight:750}.start{fill:#e0f2fe;stroke:#0284c7;stroke-width:2}.box{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.6}.accent{fill:#ecfdf5;stroke:#0f766e;stroke-width:1.7}.arrow{stroke:#64748b;stroke-width:2.2;marker-end:url(#arrowhead)}
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1180" height="500" rx="8" class="bg"/>
  <text x="52" y="58" class="title">Percorsi rapidi di lettura</text>
  <text x="52" y="86" class="text">Scegli il percorso in base al problema operativo. La guida non è pensata per essere letta tutta in ordine.</text>

  <rect x="70" y="205" width="210" height="96" rx="8" class="start"/>
  <text x="120" y="244" class="label">Problema SPAC</text>
  <text x="104" y="270" class="text">cosa devo fare adesso?</text>

  <rect x="380" y="95" width="220" height="82" rx="8" class="box"/>
  <text x="437" y="130" class="label">Capire</text>
  <text x="414" y="155" class="text">overview · concetti · FAQ</text>

  <rect x="380" y="205" width="220" height="82" rx="8" class="accent"/>
  <text x="434" y="240" class="label">Operare</text>
  <text x="415" y="265" class="text">setup · schemi · archivi</text>

  <rect x="380" y="315" width="220" height="82" rx="8" class="box"/>
  <text x="432" y="350" class="label">Verificare</text>
  <text x="416" y="375" class="text">checklist · quality gates</text>

  <rect x="730" y="95" width="250" height="82" rx="8" class="box"/>
  <text x="806" y="130" class="label">Standard</text>
  <text x="772" y="155" class="text">regole · decisioni · roadmap</text>

  <rect x="730" y="205" width="250" height="82" rx="8" class="accent"/>
  <text x="813" y="240" class="label">Playbook</text>
  <text x="774" y="265" class="text">procedure passo-passo</text>

  <rect x="730" y="315" width="250" height="82" rx="8" class="box"/>
  <text x="810" y="350" class="label">Diagnosi</text>
  <text x="773" y="375" class="text">troubleshooting · known issues</text>

  <line x1="280" y1="253" x2="380" y2="136" class="arrow"/>
  <line x1="280" y1="253" x2="380" y2="246" class="arrow"/>
  <line x1="280" y1="253" x2="380" y2="356" class="arrow"/>
  <line x1="600" y1="136" x2="730" y2="136" class="arrow"/>
  <line x1="600" y1="246" x2="730" y2="246" class="arrow"/>
  <line x1="600" y1="356" x2="730" y2="356" class="arrow"/>
</svg>
