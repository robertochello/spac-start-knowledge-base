<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">Esempio record materiale</title>
  <desc id="desc">Schema generico di record materiale validato.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#020617"/></linearGradient>
    <style>.title{fill:#f8fafc;font-family:Inter,Arial,sans-serif;font-size:26px;font-weight:800}.text{fill:#cbd5e1;font-family:Inter,Arial,sans-serif;font-size:15px}.label{fill:#f8fafc;font-family:Inter,Arial,sans-serif;font-size:18px;font-weight:700}.row{fill:#111827;stroke:#334155;stroke-width:1.3}.head{fill:#0e7490;stroke:#67e8f9;stroke-width:1.5}.ok{fill:#22c55e;font-family:Inter,Arial,sans-serif;font-size:17px;font-weight:800}</style>
  </defs>
  <rect width="1000" height="420" rx="26" fill="url(#bg)"/>
  <text x="48" y="58" class="title">Esempio generico — Record materiale</text>
  <text x="48" y="86" class="text">Un materiale è stabile solo se i campi minimi sono coerenti e lo stato è chiaro.</text>
  <rect x="90" y="132" width="820" height="54" rx="12" class="head"/>
  <text x="124" y="166" class="label">Campo</text><text x="430" y="166" class="label">Esempio generico</text><text x="760" y="166" class="label">Stato</text>
  <rect x="90" y="198" width="820" height="46" rx="10" class="row"/>
  <text x="124" y="227" class="text">Codice</text><text x="430" y="227" class="text">MAT-GEN-001</text><text x="760" y="227" class="ok">OK</text>
  <rect x="90" y="252" width="820" height="46" rx="10" class="row"/>
  <text x="124" y="281" class="text">Categoria</text><text x="430" y="281" class="text">Interruttori / Accessori</text><text x="760" y="281" class="ok">OK</text>
  <rect x="90" y="306" width="820" height="46" rx="10" class="row"/>
  <text x="124" y="335" class="text">Validazione</text><text x="430" y="335" class="text">Associato a simbolo di prova</text><text x="760" y="335" class="ok">VALIDATO</text>
</svg>
