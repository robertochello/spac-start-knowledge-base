<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">Esempio pinatura</title>
  <desc id="desc">Schema generico di connessione ingresso uscita con pin associati.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#082f49"/><stop offset="1" stop-color="#020617"/></linearGradient>
    <style>.title{fill:#f8fafc;font-family:Inter,Arial,sans-serif;font-size:26px;font-weight:800}.text{fill:#cbd5e1;font-family:Inter,Arial,sans-serif;font-size:15px}.label{fill:#f8fafc;font-family:Inter,Arial,sans-serif;font-size:18px;font-weight:700}.wire{stroke:#f8fafc;stroke-width:5;stroke-linecap:round}.pin{fill:#38bdf8}.body{fill:#111827;stroke:#38bdf8;stroke-width:2}.tag{fill:#172554;stroke:#60a5fa;stroke-width:1.5}</style>
  </defs>
  <rect width="1000" height="420" rx="26" fill="url(#bg)"/>
  <text x="48" y="58" class="title">Esempio generico — Simbolo cablato</text>
  <text x="48" y="86" class="text">Il segnale entra da un lato e può essere riportato sull'altro lato quando serve continuità logica.</text>
  <line x1="120" y1="230" x2="880" y2="230" class="wire"/>
  <rect x="365" y="155" width="270" height="150" rx="22" class="body"/>
  <circle cx="365" cy="230" r="10" class="pin"/>
  <circle cx="635" cy="230" r="10" class="pin"/>
  <rect x="178" y="155" width="138" height="52" rx="14" class="tag"/>
  <text x="213" y="188" class="label">PINA1</text>
  <rect x="684" y="155" width="138" height="52" rx="14" class="tag"/>
  <text x="719" y="188" class="label">PINB1</text>
  <text x="420" y="218" class="label">SIMBOLO</text>
  <text x="413" y="252" class="text">con attraversamento</text>
</svg>
